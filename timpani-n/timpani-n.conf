#
# TIMPANI-N Configuration File
# Location: /etc/timpani/timpani-n.conf
#
# This file is sourced by systemd as EnvironmentFile.
# Uncomment and modify values as needed.

# ============================================================================
# ORCHESTRATOR CONNECTION
# ============================================================================

# Orchestrator (timpani-o) hostname or IP address
# Default: 127.0.0.1 (localhost)
ORCHESTRATOR_HOST=127.0.0.1

# Orchestrator gRPC port
# Default: 50060
ORCHESTRATOR_PORT=50060

# ============================================================================
# NODE IDENTITY
# ============================================================================

# Node ID for this timpani-n instance
# If empty, the system hostname is used
# Example: NODE_ID=node1
NODE_ID=

# ============================================================================
# ADVANCED OPTIONS (usually not needed)
# ============================================================================

# Additional command-line arguments (for debugging)
# Example: EXTRA_ARGS="-l debug"
# EXTRA_ARGS=
